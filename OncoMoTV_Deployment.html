<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onco-MoTV | Oncology Molecular Tracking & Visualization</title>
    <style>
        /* ABSOLUTE CSS RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            /* COLOR PALETTE - PROFESSIONAL CORPORATE TONE */
            --bg-primary: #0F172A; /* Deep Navy */
            --bg-secondary: #1E293B; /* Deep Slate */
            --bg-surface: rgba(30, 41, 59, 0.7);

            --accent-cyan: #00F2FF;
            --accent-purple: #7000FF;

            --text-primary: #F8FAFC; /* Cool Muted Grey/White */
            --text-secondary: #E2E8F0;
            --text-muted: #94A3B8;

            --border-color: rgba(226, 232, 240, 0.1);
            --glass-blur: blur(12px);

            --status-ongoing: #22C55E;
            --status-pending: #F59E0B;
            --status-completed: #3B82F6;
            --status-alert: #EF4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* LAYOUT STRUCTURE - Z-SCHEME */
        #app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 70px 1fr;
            height: 100vh;
            width: 100vw;
        }

        /* TOP HORIZON - ANALYTICAL HEADER */
        header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 100;
            backdrop-filter: var(--glass-blur);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .kpi-container {
            display: flex;
            gap: 48px;
        }

        .kpi-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .kpi-value {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .kpi-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* LEFT FLANK - NAVIGATION & FILTERS */
        aside {
            grid-column: 1;
            grid-row: 2;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            gap: 32px;
            overflow-y: auto;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
        }

        .filter-select {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* CENTRAL BODY - PRIMARY VISUALIZATION MATRIX */
        main {
            grid-column: 2;
            grid-row: 2;
            background: var(--bg-primary);
            padding: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .matrix-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .matrix-header {
            display: grid;
            grid-template-columns: 150px 150px 120px 120px 1fr;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .matrix-body {
            flex: 1;
            overflow-y: auto;
        }

        .matrix-row {
            display: grid;
            grid-template-columns: 150px 150px 120px 120px 1fr;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            align-items: center;
            transition: background 0.2s;
        }

        .matrix-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }

        .gantt-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .gantt-bar {
            height: 100%;
            position: absolute;
            border-radius: 4px;
        }

        /* MODAL GATE */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            width: 500px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* SCROLLBAR RESET */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header id="analytical-header">
            <div class="header-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Onco-MoTV
            </div>
            <div class="kpi-container" id="kpi-display">
                <!-- KPIs will be rendered here -->
            </div>
            <button class="btn btn-primary" onclick="openEntryModal()">+ New Entry</button>
        </header>

        <aside id="left-flank">
            <div class="filter-group">
                <label class="filter-label">Search Repository</label>
                <input type="text" class="search-input" placeholder="Gene, Variant, or ID..." oninput="handleSearch(event)">
            </div>
            <div class="filter-group">
                <label class="filter-label">Clinical Significance</label>
                <select class="filter-select" onchange="handleFilterChange('variantType', this.value)">
                    <option value="all">All Variants</option>
                    <option value="pathogenic">Pathogenic</option>
                    <option value="likely pathogenic">Likely Pathogenic</option>
                    <option value="vus">VUS</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Pipeline Status</label>
                <select class="filter-select" onchange="handleFilterChange('status', this.value)">
                    <option value="all">All Statuses</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="pending">Pending Review</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </aside>

        <main id="central-matrix">
            <div class="matrix-container">
                <div class="matrix-header">
                    <span>Gene Entity</span>
                    <span>Variant Code</span>
                    <span>Significance</span>
                    <span>Status</span>
                    <span>Study Timeline</span>
                </div>
                <div class="matrix-body" id="matrix-body">
                    <!-- Data rows will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL GATE -->
    <div id="modal-gate" style="display: none;">
        <div id="modal-overlay">
            <div class="modal-content glass-panel">
                <h2 class="modal-title">Molecular Target Entry</h2>
                <div class="form-group">
                    <label class="filter-label">Gene Symbol</label>
                    <input type="text" id="input-gene" class="search-input" placeholder="e.g. TP53">
                </div>
                <div class="form-group">
                    <label class="filter-label">Mutation</label>
                    <input type="text" id="input-mutation" class="search-input" placeholder="e.g. p.R248Q">
                </div>
                <div class="form-group">
                    <label class="filter-label">Clinical Significance</label>
                    <select id="input-significance" class="filter-select">
                        <option value="Pathogenic">Pathogenic</option>
                        <option value="Likely Pathogenic">Likely Pathogenic</option>
                        <option value="VUS">VUS</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeEntryModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEntry()">Save Record</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * ONCO-MOTV UNIFIED STATE ENGINE
         * Manages clinical arrays and UI state with zero memory leaks.
         */
        const AppState = {
            data: {
                variants: [],
                kpis: {
                    totalTracking: 0,
                    openReviews: 0,
                    pipelineHealth: 'Optimal'
                }
            },
            filters: {
                search: '',
                variantType: 'all',
                status: 'all'
            }
        };

        const renderHeader = () => {
            const kpiDisplay = document.getElementById('kpi-display');
            const { kpis } = AppState.data;

            kpiDisplay.innerHTML = `
                <div class="kpi-item">
                    <span class="kpi-value">${kpis.totalTracking}</span>
                    <span class="kpi-label">Total Tracking</span>
                </div>
                <div class="kpi-item">
                    <span class="kpi-value">${kpis.openReviews}</span>
                    <span class="kpi-label">Open Reviews</span>
                </div>
                <div class="kpi-item">
                    <span class="kpi-value" style="color: var(--status-ongoing)">${kpis.pipelineHealth}</span>
                    <span class="kpi-label">Pipeline Health</span>
                </div>
            `;
        };

        const renderFilters = () => {
            // Static filters are in HTML, no dynamic rendering needed yet
        };

        const renderMatrix = async () => {
            const matrixBody = document.getElementById('matrix-body');
            const filteredData = getFilteredData();

            matrixBody.innerHTML = '';

            await processDataAsync(filteredData, (item) => {
                const row = document.createElement('div');
                row.className = 'matrix-row';

                const statusColor = item.status === 'Ongoing' ? 'var(--status-ongoing)' :
                                  item.status === 'Pending' ? 'var(--status-pending)' : 'var(--status-completed)';

                row.innerHTML = `
                    <span style="font-weight: 700; color: var(--accent-cyan)">${item.gene}</span>
                    <span style="font-family: monospace; font-size: 12px; color: var(--text-secondary)">${item.mutation}</span>
                    <span class="status-pill" style="background: rgba(255,255,255,0.05); color: ${item.clinicalSignificance === 'Pathogenic' ? 'var(--status-alert)' : 'var(--text-primary)'}">
                        ${item.clinicalSignificance}
                    </span>
                    <span class="status-pill" style="background: ${statusColor}20; color: ${statusColor}">
                        ${item.status}
                    </span>
                    <div class="gantt-bar-container">
                        <div class="gantt-bar" style="left: ${item.progressStart}%; width: ${item.progressWidth}%; background: ${statusColor}"></div>
                    </div>
                `;
                matrixBody.appendChild(row);
            });
        };

        const updateUI = () => {
            renderHeader();
            renderMatrix();
        };

        const processDataAsync = async (dataArray, processor) => {
            const CHUNK_SIZE = 50;
            let index = 0;

            return new Promise((resolve) => {
                const nextChunk = () => {
                    const end = Math.min(index + CHUNK_SIZE, dataArray.length);
                    for (; index < end; index++) {
                        processor(dataArray[index]);
                    }

                    if (index < dataArray.length) {
                        requestAnimationFrame(nextChunk);
                    } else {
                        resolve();
                    }
                };
                nextChunk();
            });
        };

        const getFilteredData = () => {
            const { variants } = AppState.data;
            const { search, variantType, status } = AppState.filters;

            return variants.filter(v => {
                const matchSearch = !search ||
                    v.gene.toLowerCase().includes(search.toLowerCase()) ||
                    v.mutation.toLowerCase().includes(search.toLowerCase());

                const matchType = variantType === 'all' || v.clinicalSignificance.toLowerCase() === variantType.toLowerCase();
                const matchStatus = status === 'all' || v.status.toLowerCase() === status.toLowerCase();

                return matchSearch && matchType && matchStatus;
            });
        };

        const handleSearch = (e) => {
            AppState.filters.search = e.target.value;
            updateUI();
        };

        const handleFilterChange = (key, value) => {
            AppState.filters[key] = value;
            updateUI();
        };

        const openEntryModal = () => {
            document.getElementById('modal-gate').style.display = 'block';
        };

        const closeEntryModal = () => {
            document.getElementById('modal-gate').style.display = 'none';
        };

        const saveEntry = () => {
            const gene = document.getElementById('input-gene').value;
            const mutation = document.getElementById('input-mutation').value;
            const significance = document.getElementById('input-significance').value;

            if (!gene || !mutation) {
                alert('Type Validation Failed: All fields are required.');
                return;
            }

            const newVariant = {
                gene: gene.toUpperCase(),
                mutation: mutation,
                clinicalSignificance: significance,
                status: 'Pending',
                progressStart: 0,
                progressWidth: 10,
                source: 'Manual Entry'
            };

            AppState.data.variants.unshift(newVariant);
            AppState.data.kpis.totalTracking++;
            AppState.data.kpis.openReviews++;

            updateUI();
            closeEntryModal();

            // Reset fields
            document.getElementById('input-gene').value = '';
            document.getElementById('input-mutation').value = '';
        };

        window.addEventListener('DOMContentLoaded', () => {
            console.log('Onco-MoTV Engine Initialized');

            // POPULATE CLINICAL-GRADE MOCK DATA
            const mockVariants = [
                { gene: 'TP53', mutation: 'p.R248Q', clinicalSignificance: 'Pathogenic', status: 'Ongoing', progressStart: 10, progressWidth: 45 },
                { gene: 'PIK3CA', mutation: 'p.E545K', clinicalSignificance: 'Pathogenic', status: 'Completed', progressStart: 0, progressWidth: 100 },
                { gene: 'EGFR', mutation: 'p.L858R', clinicalSignificance: 'Pathogenic', status: 'Ongoing', progressStart: 25, progressWidth: 60 },
                { gene: 'AKT1', mutation: 'p.E17K', clinicalSignificance: 'Likely Pathogenic', status: 'Pending', progressStart: 5, progressWidth: 15 },
                { gene: 'BRCA1', mutation: 'c.68_69delAG', clinicalSignificance: 'Pathogenic', status: 'Ongoing', progressStart: 40, progressWidth: 30 },
                { gene: 'BRCA2', mutation: 'p.S1982fs', clinicalSignificance: 'Pathogenic', status: 'Completed', progressStart: 0, progressWidth: 100 },
                { gene: 'NOTCH1', mutation: 'p.L1601P', clinicalSignificance: 'Pathogenic', status: 'Ongoing', progressStart: 15, progressWidth: 50 },
                { gene: 'HRAS', mutation: 'p.G12V', clinicalSignificance: 'Pathogenic', status: 'Pending', progressStart: 10, progressWidth: 20 },
                { gene: 'TERT', mutation: 'C228T', clinicalSignificance: 'Pathogenic', status: 'Ongoing', progressStart: 30, progressWidth: 40 },
                { gene: 'KRAS', mutation: 'p.G12D', clinicalSignificance: 'Pathogenic', status: 'Completed', progressStart: 0, progressWidth: 100 },
                { gene: 'FAT1', mutation: 'p.R4454*', clinicalSignificance: 'Likely Pathogenic', status: 'Ongoing', progressStart: 50, progressWidth: 25 },
                { gene: 'BRAF', mutation: 'p.V600E', clinicalSignificance: 'Pathogenic', status: 'Pending', progressStart: 20, progressWidth: 10 }
            ];

            AppState.data.variants = mockVariants;
            AppState.data.kpis = {
                totalTracking: mockVariants.length,
                openReviews: mockVariants.filter(v => v.status === 'Pending').length,
                pipelineHealth: 'Optimal'
            };

            updateUI();
        });
    </script>
</body>
</html>
